name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Install cocogitto
        uses: cocogitto/cocogitto-action@v3

      - name: Configure Git identity
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Bump version and create tag
        id: bump
        run: |
          cog bump --auto
          TAG=$(git tag --points-at HEAD | head -n 1)
          if [ -z "$TAG" ]; then
            echo "No version bump performed (no version-worthy commits)."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "Created tag: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build WASM release
        if: steps.bump.outputs.bumped == 'true'
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Push tag
        if: steps.bump.outputs.bumped == 'true'
        run: git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --generate-notes \
            --title "${{ steps.bump.outputs.tag }}" \
            target/wasm32-unknown-unknown/release/cextauthz.wasm
